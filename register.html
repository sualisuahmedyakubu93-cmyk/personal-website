<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | YASU Tech</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


<main class="auth-page">

    <section class="auth-container">

        <h1>Create Account</h1>

        <p>
            Register to access the website.
        </p>


        <form id="registerForm">


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                autocomplete="new-password"
                required
            >


            <button type="submit">
                Register
            </button>


            <p id="message"></p>


        </form>


        <p>
            Already have an account?

            <a href="login.html">
                Login here
            </a>
        </p>


    </section>

</main>


<script>

const registerForm =
    document.getElementById(
        "registerForm"
    );


const message =
    document.getElementById(
        "message"
    );


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById(
                    "username"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "email"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        message.textContent =
            "Creating your account...";


        try {

            const response =
                await fetch(
                    "/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username,
                                email,
                                password
                            })
                    }
                );


            const data =
                await response.json();


            message.textContent =
                data.message;


            if (response.ok) {

                sessionStorage.setItem(
                    "verificationEmail",
                    email
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "verify-otp.html";

                    },
                    1500
                );
            }

        } catch (error) {

            message.textContent =
                "Unable to connect to the server.";
        }

    }
);

</script>


</body>

</html>
