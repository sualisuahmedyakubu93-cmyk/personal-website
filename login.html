<meta charset="UTF-8">

<title>Login | YASU Tech</title>


<style>

    /* =========================================
       PAGE
    ========================================== */

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #eff6ff,
                #ffffff
            );

        color: #111827;

    }


    .auth-page {

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px 20px;

    }


    /* =========================================
       LOGIN CONTAINER
    ========================================== */

    .auth-container {

        width: 100%;

        max-width: 450px;

        background: #ffffff;

        padding: 42px 38px;

        border-radius: 18px;

        box-shadow:
            0 20px 50px
            rgba(15, 23, 42, 0.10);

        border:
            1px solid
            #e5e7eb;

    }


    /* =========================================
       YASU TECH LOGO
    ========================================== */

    .auth-logo {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 12px;

        margin-bottom: 28px;

    }


    .logo-mark {

        width: 58px;

        height: 58px;

        border-radius: 14px;

        display: flex;

        align-items: center;

        justify-content: center;

        background:
            linear-gradient(
                135deg,
                #111827,
                #2563eb
            );

        box-shadow:
            0 8px 20px
            rgba(37, 99, 235, 0.20);

    }


    .logo-mark svg {

        width: 38px;

        height: 38px;

        fill: none;

        stroke: #ffffff;

        stroke-width: 3;

        stroke-linecap: round;

        stroke-linejoin: round;

    }


    .logo-text {

        font-size: 30px;

        font-weight: 800;

        letter-spacing: -0.8px;

        color: #111827;

    }


    .logo-text span {

        color: #2563eb;

    }


    /* =========================================
       HEADING
    ========================================== */

    .auth-container h1 {

        margin:

            0 0 10px;

        text-align: center;

        font-size: 28px;

        line-height: 1.25;

        color: #111827;

    }


    .auth-container > p {

        margin:

            0 0 28px;

        text-align: center;

        color: #6b7280;

        font-size: 15px;

        line-height: 1.6;

    }


    /* =========================================
       FORM
    ========================================== */

    #loginForm {

        width: 100%;

    }


    #loginForm > label:not(.checkbox-label) {

        display: block;

        margin:

            0 0 8px;

        font-size: 14px;

        font-weight: 600;

        color: #374151;

    }


    .input-wrapper {

        position: relative;

        margin-bottom: 20px;

    }


    .input-icon {

        position: absolute;

        left: 14px;

        top: 50%;

        transform:
            translateY(-50%);

        width: 20px;

        height: 20px;

        fill: none;

        stroke: #6b7280;

        stroke-width: 2;

        stroke-linecap: round;

        stroke-linejoin: round;

        pointer-events: none;

    }


    .input-wrapper input {

        width: 100%;

        height: 50px;

        padding:

            0 46px;

        border:

            1px solid
            #d1d5db;

        border-radius: 10px;

        background: #ffffff;

        color: #111827;

        font-size: 15px;

        outline: none;

        transition:

            border-color 0.2s ease,

            box-shadow 0.2s ease;

    }


    .input-wrapper input:focus {

        border-color: #2563eb;

        box-shadow:
            0 0 0 3px
            rgba(37, 99, 235, 0.12);

    }


    .input-wrapper input::placeholder {

        color: #9ca3af;

    }


    /* =========================================
       PASSWORD SHOW / HIDE
    ========================================== */

    .password-toggle {

        position: absolute;

        right: 13px;

        top: 50%;

        transform:
            translateY(-50%);

        border: none;

        background: transparent;

        cursor: pointer;

        padding: 5px;

        display: flex;

        align-items: center;

        justify-content: center;

    }


    .password-toggle svg {

        width: 20px;

        height: 20px;

        stroke: #6b7280;

        fill: none;

        stroke-width: 2;

        stroke-linecap: round;

        stroke-linejoin: round;

    }


    .password-toggle:hover svg {

        stroke: #2563eb;

    }


    /* =========================================
       REMEMBER ME
    ========================================== */

    .checkbox-label {

        display: flex;

        align-items: center;

        gap: 8px;

        margin:

            5px 0 22px;

        font-size: 14px;

        color: #4b5563;

        cursor: pointer;

    }


    .checkbox-label input {

        width: 16px;

        height: 16px;

        cursor: pointer;

    }


    /* =========================================
       LOGIN BUTTON
    ========================================== */

    #loginForm button[type="submit"] {

        width: 100%;

        height: 50px;

        border: none;

        border-radius: 10px;

        background:
            linear-gradient(
                135deg,
                #111827,
                #2563eb
            );

        color: #ffffff;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition:

            transform 0.2s ease,

            box-shadow 0.2s ease;

    }


    #loginForm button[type="submit"]:hover {

        transform:
            translateY(-1px);

        box-shadow:
            0 8px 20px
            rgba(37, 99, 235, 0.25);

    }


    #loginForm button[type="submit"]:active {

        transform:
            translateY(0);

    }


    #loginForm button[type="submit"]:disabled {

        opacity: 0.7;

        cursor: not-allowed;

        transform: none;

        box-shadow: none;

    }


    /* =========================================
       MESSAGE
    ========================================== */

    #message {

        margin:

            15px 0 0;

        text-align: center;

        font-size: 14px;

        min-height: 20px;

        color: #dc2626;

    }


    /* =========================================
       CREATE ACCOUNT
    ========================================== */

    .register-text {

        margin:

            24px 0 0;

        text-align: center;

        color: #6b7280;

        font-size: 14px;

    }


    .register-text a {

        color: #2563eb;

        font-weight: 600;

        text-decoration: none;

    }


    .register-text a:hover {

        text-decoration: underline;

    }


    /* =========================================
       ADMINISTRATOR LOGIN
    ========================================== */

    .admin-login-text {

        margin:

            14px 0 0;

        text-align: center;

        color: #6b7280;

        font-size: 14px;

    }


    .admin-login-text a {

        color: #111827;

        font-weight: 600;

        text-decoration: none;

    }


    .admin-login-text a:hover {

        color: #2563eb;

        text-decoration: underline;

    }


    /* =========================================
       MOBILE RESPONSIVE DESIGN
    ========================================== */

    @media (max-width: 480px) {

        .auth-container {

            padding:
                32px 22px;

            border-radius: 15px;

        }


        .logo-text {

            font-size: 26px;

        }


        .logo-mark {

            width: 52px;

            height: 52px;

        }


        .auth-container h1 {

            font-size: 25px;

        }

    }

</style>
```

</main>

<script>


    /* =========================================
       LOGIN ELEMENTS
    ========================================== */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const message =
        document.getElementById(
            "message"
        );


    const password =
        document.getElementById(
            "password"
        );


    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );


    const eyeIcon =
        document.getElementById(
            "eyeIcon"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    /* =========================================
       SHOW / HIDE PASSWORD
    ========================================== */

    passwordToggle.addEventListener(
        "click",
        function () {

            if (
                password.type === "password"
            ) {

                password.type =
                    "text";


                passwordToggle.setAttribute(
                    "aria-label",
                    "Hide password"
                );


                eyeIcon.innerHTML = `

                    <path
                        d="M2 12
                           C5 7
                           8.5 5
                           12 5
                           C15.5 5
                           19 7
                           22 12
                           C19 17
                           15.5 19
                           12 19
                           C8.5 19
                           5 17
                           2 12Z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />

                    <path
                        d="M4 4 L20 20"
                    />

                `;

            }

            else {

                password.type =
                    "password";


                passwordToggle.setAttribute(
                    "aria-label",
                    "Show password"
                );


                eyeIcon.innerHTML = `

                    <path
                        d="M2 12
                           C5 7
                           8.5 5
                           12 5
                           C15.5 5
                           19 7
                           22 12
                           C19 17
                           15.5 19
                           12 19
                           C8.5 19
                           5 17
                           2 12Z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />

                `;

            }

        }
    );


    /* =========================================
       NORMAL USER LOGIN
    ========================================== */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const passwordValue =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const rememberMe =
                document
                    .getElementById(
                        "rememberMe"
                    )
                    .checked;


            message.textContent =
                "Logging in...";

            message.style.color =
                "#2563eb";


            loginButton.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    password:
                                        passwordValue,
                                    rememberMe
                                })
                        }
                    );


                const data =
                    await response.json();


                /* =================================
                   LOGIN ERROR
                ================================== */

                if (!response.ok) {

                    if (
                        data.needsVerification
                    ) {

                        sessionStorage.setItem(
                            "verificationEmail",
                            data.email
                        );


                        window.location.href =
                            "verify-otp.html";


                        return;

                    }


                    message.style.color =
                        "#dc2626";


                    message.textContent =
                        data.message ||
                        "Incorrect username or password.";


                    loginButton.disabled =
                        false;


                    return;

                }


                /* =================================
                   STORE USER SESSION
                ================================== */

                const storage =
                    rememberMe
                        ? localStorage
                        : sessionStorage;


                storage.setItem(
                    "userToken",
                    data.token
                );


                if (
                    data.user
                    &&
                    data.user.username
                ) {

                    storage.setItem(
                        "username",
                        data.user.username
                    );

                }


                if (
                    data.user
                    &&
                    data.user.role
                ) {

                    storage.setItem(
                        "userRole",
                        data.user.role
                    );

                }


                /* =================================
                   LOGIN SUCCESS
                ================================== */

                message.style.color =
                    "#16a34a";


                message.textContent =
                    "Login successful. Redirecting...";


                /*
                    The main public website is
                    index.html.

                    Administrators are sent to
                    the administrator dashboard.
                */

                if (
                    data.user
                    &&
                    data.user.role === "admin"
                ) {

                    window.location.href =
                        "admin/dashboard.html";

                }

                else {

                    window.location.href =
                        "index.html";

                }

            }


            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                message.style.color =
                    "#dc2626";


                message.textContent =
                    "Unable to connect to the server.";


                loginButton.disabled =
                    false;

            }

        }
    );


</script>

</body>
