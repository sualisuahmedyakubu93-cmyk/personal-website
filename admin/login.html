<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrator Login | YASU Tech</title>

    <link
        rel="stylesheet"
        href="../CSS/styles.css"
    >
<link
    rel="stylesheet"
    href="../CSS/styles.css"
>

<style>
    .admin-login-logo {
        display: block;
        width: 100%;
        max-width: 300px;
        height: 100px;
        object-fit: contain;
        object-position: center;
    }
</style>

</head>


<body>


<main class="auth-page">

    <section class="auth-container">

        <h1>
            Administrator Login
        </h1>
        <div class="auth-logo">
    <img
        src="../yasu-tech-logo/yasu-tech-logo-transparent.png"
        alt="YASU Tech official logo"
        class="admin-login-logo"
    >
</div>


        <form id="adminLoginForm">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >


            <label>

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                Remember me

            </label>


            <button type="submit">
                Login
            </button>


            <p id="message"></p>

        </form>

    </section>

</main>


<script>

document
    .getElementById(
        "adminLoginForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value;


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const rememberMe =
                document
                    .getElementById(
                        "rememberMe"
                    )
                    .checked;


            const response =
                await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username,
                                password,
                                rememberMe
                            })
                    }
                );


            const data =
                await response.json();
            /*
            =================================
            MFA VERIFICATION REQUIRED
            =================================
            */

            if (
                response.ok &&
                data.mfaRequired === true
            ) {

                // Remove any previous authenticated session.
                for (const store of [
                    localStorage,
                    sessionStorage
                ]) {

                    store.removeItem("userToken");
                    store.removeItem("userRole");
                    store.removeItem("username");

                }

                // Save only the temporary MFA challenge.
                sessionStorage.setItem(
                    "mfaChallengeId",
                    data.challengeId
                );

                sessionStorage.setItem(
                    "mfaMethod",
                    data.method
                );

                // Identify that verification began from
                // the administrator login page.
                sessionStorage.setItem(
                    "mfaLoginOrigin",
                    "admin"
                );

                window.location.href =
                    "../mfa-verify.html";

                return;
            }

            if (!response.ok) {

                document
                    .getElementById(
                        "message"
                    )
                    .textContent =
                        data.message;

                return;
            }


            const staffRoles = [
    "super_admin",
    "admin",
    "content_staff",
    "technical_staff",
    "departmental_staff"
];

if (!staffRoles.includes(data.user.role)) {

    document
        .getElementById("message")
        .textContent =
            "Your account does not have staff dashboard access.";

    return;
}


            // Remove the previous account's identity from both storages.
for (const store of [localStorage, sessionStorage]) {
    store.removeItem("userToken");
    store.removeItem("userRole");
    store.removeItem("username");
}

// Save the identity of the account that just logged in.
const storage = rememberMe ? localStorage : sessionStorage;

storage.setItem("userToken", data.token);
storage.setItem("userRole", data.user.role);
storage.setItem("username", data.user.username);


            window.location.href =
                "dashboard.html";

        }
    );

</script>


</body>

</html>
