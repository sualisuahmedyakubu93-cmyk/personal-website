<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

<title>Email Verification - YASU Tech</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


<main class="auth-page">

    <section class="auth-container">

        <h1>Email Verification</h1>

        <p>
            Enter the OTP code sent to your email address.
        </p>


        <form id="otpForm">

            <label for="otp">
                Verification Code
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                required
            >


            <button type="submit">
                Verify Email
            </button>


            <p id="message"></p>

        </form>


        <button
            id="resendButton"
        >
            Resend OTP
        </button>


    </section>

</main>


<script>

const email =
    sessionStorage.getItem(
        "verificationEmail"
    );


const message =
    document.getElementById(
        "message"
    );


if (!email) {

    window.location.href =
        "register.html";

}


document
    .getElementById(
        "otpForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const otp =
                document
                    .getElementById(
                        "otp"
                    )
                    .value
                    .trim();


            try {

                const response =
                    await fetch(
                        "/api/auth/verify-otp",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    email,
                                    otp
                                })
                        }
                    );


                const data =
                    await response.json();


                message.textContent =
                    data.message;


                if (response.ok) {

                    sessionStorage.removeItem(
                        "verificationEmail"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "login.html";

                        },
                        1500
                    );
                }

            } catch (error) {

                message.textContent =
                    "Unable to verify OTP.";
            }

        }
    );


document
    .getElementById(
        "resendButton"
    )
    .addEventListener(
        "click",
        async function() {

            try {

                const response =
                    await fetch(
                        "/api/auth/resend-otp",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    email
                                })
                        }
                    );


                const data =
                    await response.json();


                message.textContent =
                    data.message;

            } catch (error) {

                message.textContent =
                    "Unable to resend OTP.";
            }

        }
    );

</script>


</body>

</html>
